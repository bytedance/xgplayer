<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FFmpeg + MSE</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #17212b; background: #f5f6f8; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; gap: 16px; max-width: 960px; margin: auto; }
      section, details { padding: 20px; border: 1px solid #ddd; background: white; border-radius: 8px; }
      h1 { margin: 0; font-size: 22px; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      p { margin: 8px 0; color: #526171; }
      #player { width: 100%; min-height: 80px; margin: 16px 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
      input, select, button { font: inherit; border: 1px solid #b8c4ce; border-radius: 4px; padding: 7px 10px; }
      input[type="url"] { flex: 1; min-width: 200px; }
      input[type="number"] { width: 100px; }
      button { cursor: pointer; background: #edf8f3; color: #006c3b; }
      button:disabled { opacity: .5; cursor: default; }
      #state { display: block; color: #006c3b; margin-top: 12px; }
      #status { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 ui-monospace, monospace; }
      summary { cursor: pointer; }
      @media (max-width: 600px) { body { padding: 12px; } section, details { padding: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>FFmpeg + MSE</h1>
        <p>边下载、边转码、边播放。当前默认策略提取音轨并输出 AAC-LC；未缓冲位置需等待转码，已清理的位置会重新加载。</p>
        <div id="player"></div>
        <div class="row">
          <button id="play" type="button">播放</button>
          <button id="pause" type="button">暂停</button>
          <button id="cancel" type="button">取消 / 销毁</button>
          <button id="restart" type="button">从头加载</button>
          <label>秒 <input id="seek-time" type="number" min="0" value="0" /></label>
          <button id="seek" type="button">跳转</button>
          <button id="seek-start" type="button">跳到开头</button>
          <button id="seek-end" type="button">跳到结尾前</button>
        </div>
        <output id="state" aria-live="polite">等待加载媒体</output>
      </section>
      <section aria-label="媒体源">
        <h2>媒体源</h2>
        <div class="row">
          <input id="url" type="url" aria-label="媒体 URL" placeholder="https://example.com/media.wma" />
          <button id="load-url" type="button">加载 URL</button>
          <button id="switch-url" type="button">切换并保留进度</button>
        </div>
        <div class="row">
          <label>输入格式
            <select id="input-format">
              <option value="">自动识别（带文件头）</option>
              <option value="s16le">PCM s16le</option>
              <option value="s16be">PCM s16be</option>
              <option value="s8">PCM s8</option>
              <option value="u8">PCM u8</option>
              <option value="alaw">A-law</option>
              <option value="mulaw">μ-law</option>
            </select>
          </label>
          <label>采样率 <input id="input-rate" type="number" min="1" value="16000" /></label>
          <label>声道数 <input id="input-channels" type="number" min="1" value="1" /></label>
        </div>
        <p>URL 需要允许跨域下载。无文件头的原始音频必须填写实际格式、采样率和声道数。</p>
      </section>
      <details>
        <summary>运行状态</summary>
        <pre id="status">尚未加载</pre>
      </details>
    </main>
    <script type="module" src="./index.js"></script>
  </body>
</html>
