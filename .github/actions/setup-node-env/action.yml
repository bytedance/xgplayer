name: 'Setup Node Environment'
description: 'Setup Node.js and cached project dependencies'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'
  yarn-version:
    description: 'Yarn version'
    required: false
    default: '1.22.22'
  registry-url:
    description: 'NPM registry URL'
    required: false
    default: ''
  install-deps:
    description: 'Whether to install project dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v5
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-deps-${{ hashFiles('**/package.json', '**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version }}-deps-

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@${{ inputs.yarn-version }} --activate
        yarn --version

    - name: Install project dependencies
      if: inputs.install-deps == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        yarn install --frozen-lockfile --registry="https://registry.yarnpkg.com"
